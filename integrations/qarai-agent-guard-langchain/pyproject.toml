[project]
name = "qarai-agent-guard-langchain"
dynamic = ["version"]
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "langchain-v(?P<base>\\d+\\.\\d+\\.\\d+)"

description = "LangChain integration for qarai-agent-guard that provides runtime security for AI agents through threat detection, policy enforcement, and content protection."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Oussama Ben Slama", email = "oussama@ben-slama.tn" },
    { name = "Safouene Ziadi", email = "ziadisafouene@gmail.com" },
]
requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]

keywords = [
    "guardrails",
    "ai-guardrails",
    "ai-safety",
    "llm",
    "llm-safety",
    "agents",
    "ai-agents",
    "prompt-injection",
    "pii",
    "data-privacy",
    "nlp",
    "arabic",
    "arabic-nlp",
    "ai-governance",
    "langchain"
]

dependencies = [
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "qarai-agent-guard",
]

[project.urls]
Homepage = "https://github.com/qarai-labs/qarai-agent-guard"
Repository = "https://github.com/qarai-labs/qarai-agent-guard"
Issues = "https://github.com/qarai-labs/qarai-agent-guard/issues"

[build-system]
requires = [
    "setuptools>=68",
    "uv-dynamic-versioning"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "twine>=6.2.0",
    "uv-dynamic-versioning>=0.14.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
