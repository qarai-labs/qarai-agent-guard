[project]
name = "qarai-agent-guard"
version = "0.1.0"
description = "A lightweight guardrails framework for AI agents that supports multiple languages, primarily Arabic and its dialects, for safety and PII governance."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Oussama Ben Slama", email = "oussama@ben-slama.tn" },
    { name = "Safouene Ziadi", email = "ziadisafouene@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]

keywords = [
    "guardrails",
    "ai-guardrails",
    "ai-safety",
    "llm",
    "llm-safety",
    "agents",
    "ai-agents",
    "prompt-injection",
    "pii",
    "data-privacy",
    "nlp",
    "arabic",
    "arabic-nlp",
    "ai-governance"
]

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/qarai-agent-guard"
Repository = "https://github.com/yourorg/qarai-agent-guard"
Issues = "https://github.com/yourorg/qarai-agent-guard/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
