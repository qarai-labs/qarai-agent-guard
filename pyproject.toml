[project]
name = "qarai-agent-guard"
dynamic = ["version"]

description = "A lightweight toolkit for building secure AI systems with built-in middleware, protected memory, and AI safety models that mitigate prompt injection, jailbreaks, and adversarial attacks."
readme = "README.md"
license = { text = "Apache-2.0" }

authors = [
    { name = "Oussama Ben Slama", email = "oussama@ben-slama.tn" },
    { name = "Safouene Ziadi", email = "ziadisafouene@gmail.com" },
]

requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]

keywords = [
    "guardrails",
    "ai-guardrails",
    "ai-safety",
    "llm",
    "llm-safety",
    "agents",
    "ai-agents",
    "prompt-injection",
    "pii",
    "data-privacy",
    "nlp",
    "arabic",
    "arabic-nlp",
    "ai-governance",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.23.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.18.0",
]


[project.urls]
Homepage = "https://github.com/qarai-labs/qarai-agent-guard"
Repository = "https://github.com/qarai-labs/qarai-agent-guard"
Issues = "https://github.com/qarai-labs/qarai-agent-guard/issues"


[build-system]
requires = [
    "hatchling",
    "uv-dynamic-versioning",
]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "uv-dynamic-versioning"


[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "v(?P<base>\\d+\\.\\d+\\.\\d+)"
fallback-version = "0.0.0"


[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.uv.workspace]
members = [
    "integrations/qarai-agent-guard-crewai",
]


[tool.hatch.build.targets.wheel]
packages = ["src/qarai_agent_guard"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qarai_agent_guard",
    "README.md",
    "LICENSE",
    "assets",
]


[dependency-groups]
dev = [
    "build>=1.5.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "twine>=6.2.0",
    "uv-dynamic-versioning>=0.14.0",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "integration: tests that load real HuggingFace models (require --run-integration)",
    "e2e: end-to-end tests running the full guard pipeline against real models",
]
