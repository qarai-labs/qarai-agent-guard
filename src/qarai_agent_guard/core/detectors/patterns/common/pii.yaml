version: 1.0
scope: common
rules:
  - id: credit_card
    name: Credit Card
    severity: critical
    pattern: '\b(?:\d[ -]*?){13,19}\b'
  - id: iban
    name: IBAN
    severity: medium
    pattern: '\b[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}\b'
  - id: email
    name: Email
    severity: low
    pattern: '(?:\[[^\]]*\]\(mailto:[^)]*\)|\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b)'
  - id: phone_e164
    name: Phone E164
    severity: low
    pattern: '\+[1-9]\d{6,14}\b'
  - id: passport_number
    name: Passport Number
    severity: medium
    pattern: '\b[A-Z]{1,2}[0-9]{6,9}\b'
