version: 1.0
scope: common
rules:
  - id: aws_access_key
    name: AWS Access Key
    severity: critical
    pattern: '\bAKIA[0-9A-Z]{16}\b'
  - id: aws_secret_key
    name: AWS Secret Key
    severity: critical
    pattern: (?i)aws_secret_access_key[\s]*[:=][\s"']*([A-Za-z0-9/+=]{40})
  - id: azure_client_secret
    name: Azure Client Secret
    severity: critical
    pattern: (?i)azure[\s\S]{0,20}client[\s_-]?secret[\s]*[:=][\s"']*([A-Za-z0-9~._\-]{34,60})
  - id: gcp_service_account
    name: GCP Service Account
    severity: critical
    pattern: '"type"\s*:\s*"service_account"'
  - id: stripe_secret_key
    name: Stripe Secret Key
    severity: critical
    pattern: '\bsk_live_[A-Za-z0-9]{24,}\b'
  - id: github_token
    name: GitHub Token
    severity: critical
    pattern: '\bghp_[A-Za-z0-9]{36}\b'
  - id: github_oauth_token
    name: GitHub OAuth Token
    severity: critical
    pattern: '\bgho_[A-Za-z0-9]{36}\b'
  - id: npm_token
    name: NPM Token
    severity: critical
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'
  - id: openai_key
    name: OpenAI Key
    severity: critical
    pattern: '\bsk-[A-Za-z0-9_-]{20,}\b'
  - id: anthropic_key
    name: Anthropic Key
    severity: critical
    pattern: '\bsk-ant-[A-Za-z0-9_-]{20,}\b'
  - id: google_api_key
    name: Google API Key
    severity: critical
    pattern: '\bAIza[0-9A-Za-z_-]{30,40}\b'
  - id: openrouter_key
    name: OpenRouter Key
    severity: critical
    pattern: '\bsk-or-v1-[A-Za-z0-9]{64}\b'
  - id: slack_token
    name: Slack Token
    severity: high
    pattern: '\bxox[abpr]-[0-9A-Za-z-]{10,}\b'
  - id: jwt
    name: JWT
    severity: high
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
  - id: bearer_token
    name: Bearer Token
    severity: high
    pattern: '(?i)bearer\s+[A-Za-z0-9._\-]{20,}'
  - id: private_key_pem
    name: Private Key PEM
    severity: critical
    pattern: '-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
  - id: database_url
    name: Database URL
    severity: high
    pattern: '(?i)(database_url|db_url|mongodb://|postgres://)'
  - id: password_assignment
    name: Password Assignment
    severity: critical
    pattern: '(?i)(password|passwd|pwd)\s*[:=]\s*[^\s]+'
  - id: api_key_context
    name: API Key Context
    severity: medium
    pattern: '(?i)(api[_\s-]?key|secret|token)\s*[:=]'
